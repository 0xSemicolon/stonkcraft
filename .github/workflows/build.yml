# Builds and tests every push and pull request. Pushing a tag like v0.9.0-beta also publishes the jar to GitHub
# Releases, Modrinth and CurseForge. One-time setup (repo Settings -> Secrets and variables -> Actions):
#   variables: MODRINTH_ID (project id or slug), CURSEFORGE_ID (numeric project id)
#   secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
# A store whose variable is unset is skipped. The changelog is the tag's section of CHANGELOG.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Loom 1.18 needs Java 25 to run Gradle; the mod itself targets Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: stonkcraft-jar
          path: build/libs/*.jar

      - name: Changelog for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " {p = index($0, v) > 0; next} p' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: Stonkcraft ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: beta
          changelog-file: release-notes.md
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
